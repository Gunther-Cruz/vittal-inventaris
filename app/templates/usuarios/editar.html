{% extends "base.html" %}

{% block title %}Editar usuario - VITTAL Inventaris{% endblock %}

{% block content %}
<h1>Editar usuario</h1>

<form method="post" action="{{ url_for('usuarios.atualizar_usuario', usuario_id=usuario.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="nome">Nome</label>
  <input id="nome" name="nome" type="text" value="{{ usuario.nome }}" autocomplete="name" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ usuario.email }}" autocomplete="email" required>

  <button type="submit">Salvar dados</button>
</form>

<form method="post" action="{{ url_for('usuarios.alterar_perfil', usuario_id=usuario.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="perfil">Perfil</label>
  <select id="perfil" name="perfil" required>
    {% for perfil in perfis %}
      <option value="{{ perfil.value }}" {% if perfil == usuario.perfil %}selected{% endif %}>{{ perfil.value }}</option>
    {% endfor %}
  </select>

  <button type="submit">Alterar perfil</button>
</form>

<p><a href="{{ url_for('usuarios.listar_usuarios') }}">Voltar para usuarios</a></p>
{% endblock %}
